[package]
name = "nextdo-desktop"
version = "0.1.9-beta.11"
description = "Nextdo desktop shell (Tauri v2) — wraps the @nextdo/mobile web build"
authors = ["Nextdo"]
edition = "2021"

[lib]
name = "nextdo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-stronghold = "2.3.2"
# Local reminder delivery (task 09-30): the desktop webview calls
# sendNotification / isPermissionGranted through this plugin. 2.4.0 is
# the version pair for tauri 2.11 (2.5.0 would force a core 2.12 upgrade);
# research in .trellis/tasks/09-30-reminder-notification-delivery/research/
# documents the desktop constraints (no native scheduling — the app's JS
# tick drives delivery).
tauri-plugin-notification = "2.4.0"
# Loopback static file server for release builds (see lib.rs module docs —
# the PowerSync module worker needs a real http origin, not tauri://).
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-event-kit = "0.3.2"
objc2-foundation = "0.3.2"
